apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app-optimal
  labels:
    app: spring-boot-app
    config: optimal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-boot-app
      config: optimal
  template:
    metadata:
      labels:
        app: spring-boot-app
        config: optimal
    spec:
      containers:
        - name: app
          image: eclipse-temurin:21-jre-alpine
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:InitialRAMPercentage=50.0
                -XX:+ExitOnOutOfMemoryError
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/tmp/heapdump.hprof
                -Djava.awt.headless=true
          command: ["java", "-jar", "/app.jar"]
          resources:
            requests:
              cpu: "500m"
              memory: "1536Mi"
            limits:
              # Provides 2048Mi container limit -> Heap is capped at 1536Mi (75%)
              # 512Mi reserved for Metaspace, thread stacks, Netty buffers, and native OS libs
              memory: "2048Mi"
