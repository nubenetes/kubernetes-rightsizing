apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api-service-vpa
  namespace: default
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: api-service-optimal
  updatePolicy:
    # SAFE DEFAULT: "Off" mode generates recommendations without evicting running pods
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "web-api"
        mode: "Auto"
        # Deterministic guardrails: prevent VPA from under-provisioning or runaway inflation
        minAllowed:
          cpu: "250m"
          memory: "512Mi"
        maxAllowed:
          cpu: "4000m"
          memory: "8Gi"
        controlledResources: ["cpu", "memory"]
        controlledValues: "RequestsAndLimits"
