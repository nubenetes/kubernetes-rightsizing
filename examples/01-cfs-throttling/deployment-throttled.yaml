apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-throttled
  labels:
    app: api-service
    tier: throttled-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
      tier: throttled-demo
  template:
    metadata:
      labels:
        app: api-service
        tier: throttled-demo
    spec:
      containers:
        - name: web-api
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              # ANTI-PATTERN: Rigid CPU limits on multi-threaded services trigger Linux CFS throttling
              cpu: "300m"
              memory: "512Mi"
